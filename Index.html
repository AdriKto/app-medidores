<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toma de Lecturas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h3 class="mb-4">Nueva Lectura</h3>
    
    <form id="formularioLectura">
        <!-- El escáner de código de barras llenará este campo -->
        <div class="mb-3">
            <label class="form-label">ID Medidor</label>
            <input type="number" class="form-control" id="idMedidor" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Lectura (kW/h)</label>
            <input type="number" step="0.01" class="form-control" id="valorLectura" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Foto del Medidor</label>
            <input type="file" accept="image/*" capture="environment" class="form-control" id="fotoMedidor" required>
        </div>

        <button type="button" class="btn btn-primary w-100" onclick="comprimirYEnviar()">Guardar Lectura</button>
    </form>

    <script>
        async function comprimirYEnviar() {
            const idMedidor = document.getElementById('idMedidor').value;
            const valorLectura = document.getElementById('valorLectura').value;
            const archivo = document.getElementById('fotoMedidor').files[0];

            if (!idMedidor || !valorLectura || !archivo) {
                alert("Completa todos los campos");
                return;
            }

            // 1. Leer la imagen original
            const reader = new FileReader();
            reader.readAsDataURL(archivo);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    // 2. Redimensionar usando Canvas (máx 800px de ancho)
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    // 3. Convertir a Blob (JPG comprimido al 70%)
                    canvas.toBlob(async (blob) => {
                        // 4. Armar el paquete para enviar a la API
                        const formData = new FormData();
                        formData.append('id_medidor', idMedidor);
                        formData.append('valor', valorLectura);
                        formData.append('foto', blob, `medidor_${idMedidor}.jpg`);

                        // 5. Llamada al backend
                        try {
                            const response = await fetch('/api/lecturas',{
                                method: 'POST',
                                body: formData
                            });
                            if (response.ok) {
                                alert('Lectura guardada correctamente');
                                document.getElementById('formularioLectura').reset();
                            } else {
                                alert('Error al guardar en el servidor');
                            }
                        } catch (error) {
                            console.error('Error:', error);
                            alert('Error de conexión');
                        }
                    }, 'image/jpeg', 0.7);
                }
            };
        }
    </script>
</body>
</html>

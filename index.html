<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toma de Lecturas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="container mt-4 mb-5">
    <h3 class="mb-4">Toma de Consumo</h3>
    
    <!-- PASO 1: Escáner de Código de Barras -->
    <div id="seccionEscaner">
        <div class="alert alert-info">Paso 1: Identificá el medidor.</div>
        <div id="lectorCamara" style="width: 100%; border-radius: 8px; overflow: hidden;"></div>
        <button class="btn btn-dark w-100 mt-3" onclick="iniciarEscaner()">Abrir Cámara para Escanear</button>
    </div>

    <!-- PASO 2: Formulario de Carga (Oculto inicialmente) -->
    <form id="formularioLectura" style="display: none;">
        <div id="contenedorAlertaLote"></div>
        
        <div class="mb-3 mt-2">
            <label class="form-label">ID Medidor</label>
            <input type="text" class="form-control fw-bold bg-light" id="idMedidor" readonly>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Paso 2: Lectura Actual (kW/h)</label>
            <input type="number" step="0.01" class="form-control" id="valorLectura" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Paso 3: Foto de Evidencia</label>
            <input type="file" accept="image/*" capture="environment" class="form-control" id="fotoMedidor" required>
        </div>

        <button type="button" class="btn btn-primary w-100 btn-guardar" onclick="comprimirYEnviar()">Guardar Lectura</button>
        <button type="button" class="btn btn-outline-secondary w-100 mt-2" onclick="reiniciarApp()">Cancelar / Volver a escanear</button>
    </form>

    <script>
        let html5QrCode;
        const API_URL = 'https://api-medidores-x258.onrender.com/api';

        function iniciarEscaner() {
            html5QrCode = new Html5Qrcode("lectorCamara");
            const config = { fps: 10, qrbox: { width: 280, height: 120 } }; 

            html5QrCode.start({ facingMode: "environment" }, config, 
                async (codigoEscaneado) => {
                    html5QrCode.stop().then(async () => {
                        document.getElementById('seccionEscaner').innerHTML = '<div class="alert alert-warning">Consultando medidor...</div>';
                        
                        try {
                            const respuesta = await fetch(`${API_URL}/medidores/${codigoEscaneado}`);
                            const datos = await respuesta.json();

                            if (datos.status === "success") {
                                document.getElementById('idMedidor').value = codigoEscaneado;
                                
                                document.getElementById('contenedorAlertaLote').innerHTML = `
                                    <div class="alert alert-success mt-3 mb-0">
                                        <strong>Lote Detectado:</strong> ${datos.lote}
                                    </div>`;

                                document.getElementById('seccionEscaner').style.display = 'none';
                                document.getElementById('formularioLectura').style.display = 'block';
                            } else {
                                alert("El medidor no está registrado en el sistema.");
                                reiniciarApp();
                            }
                        } catch (error) {
                            alert("Error al validar el medidor con el servidor.");
                            reiniciarApp();
                        }
                    });
                },
                (error) => {} // Ignorar errores mientras enfoca
            ).catch(err => {
                alert("Error de cámara. Asegurate de dar permisos.");
            });
        }

        function reiniciarApp() {
            // Restauramos la vista del escáner
            document.getElementById('formularioLectura').reset();
            document.getElementById('formularioLectura').style.display = 'none';
            document.getElementById('contenedorAlertaLote').innerHTML = '';
            
            document.getElementById('seccionEscaner').innerHTML = `
                <div class="alert alert-info">Paso 1: Identificá el medidor.</div>
                <div id="lectorCamara" style="width: 100%; border-radius: 8px; overflow: hidden;"></div>
                <button class="btn btn-dark w-100 mt-3" onclick="iniciarEscaner()">Abrir Cámara para Escanear</button>
            `;
            document.getElementById('seccionEscaner').style.display = 'block';
        }

        async function comprimirYEnviar() {
            const idMedidor = document.getElementById('idMedidor').value;
            const valorLectura = document.getElementById('valorLectura').value;
            const archivo = document.getElementById('fotoMedidor').files[0];

            if (!idMedidor || !valorLectura || !archivo) {
                alert("Faltan completar datos (lectura o foto).");
                return;
            }

            const btnGuardar = document.querySelector('.btn-guardar');
            btnGuardar.disabled = true;
            btnGuardar.innerText = "Guardando y subiendo foto...";

            const reader = new FileReader();
            reader.readAsDataURL(archivo);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    canvas.toBlob(async (blob) => {
                        const formData = new FormData();
                        formData.append('id_medidor', idMedidor);
                        formData.append('valor', valorLectura);
                        formData.append('foto', blob, `medidor_${idMedidor}.jpg`);

                        try {
                            const response = await fetch(`${API_URL}/lecturas`, {
                                method: 'POST',
                                body: formData
                            });
                            const result = await response.json();
                            
                            if (response.ok && result.status === "success") {
                                alert('¡Lectura guardada correctamente!');
                                reiniciarApp();
                            } else {
                                alert(`Error del servidor: ${result.mensaje}`);
                            }
                        } catch (error) {
                            alert('Falló la conexión de red al enviar los datos.');
                        } finally {
                            btnGuardar.disabled = false;
                            btnGuardar.innerText = "Guardar Lectura";
                        }
                    }, 'image/jpeg', 0.7);
                }
            };
        }
    </script>
</body>
</html>

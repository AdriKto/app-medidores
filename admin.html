<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4 mb-5">

    <!-- Pantalla de Login -->
    <div id="pantallaLogin" class="card mx-auto mt-5" style="max-width: 400px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <div class="card-body">
            <h4 class="card-title text-center mb-4">Acceso Administración</h4>
            <div class="mb-3">
                <input type="password" id="inputPass" class="form-control" placeholder="Ingresá la contraseña">
            </div>
            <button class="btn btn-dark w-100" onclick="verificarAcceso()">Ingresar</button>
        </div>
    </div>

    <!-- Pantalla del Dashboard (Oculta por defecto) -->
    <div id="pantallaDashboard" style="display: none;">
        
        <div class="row mb-4 align-items-center">
            <div class="col-md-4">
                <h2>Consumos</h2>
            </div>
            <div class="col-md-4">
                <div class="input-group">
                    <span class="input-group-text bg-light">Filtrar Mes:</span>
                    <select id="filtroPeriodo" class="form-select" onchange="aplicarFiltro()">
                        <option value="todos">Todos los meses</option>
                        <!-- Las opciones se cargan por JavaScript -->
                    </select>
                </div>
            </div>
            <div class="col-md-4 text-end">
                <button class="btn btn-success w-100" onclick="exportarCSV()">Descargar CSV</button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Período</th>
                        <th>Lote</th>
                        <th>Medidor</th>
                        <th>Lectura Actual</th>
                        <th>Lectura Anterior</th>
                        <th>Consumo Neto</th>
                        <th>Evidencia</th>
                    </tr>
                </thead>
                <tbody id="tablaCuerpo">
                    <tr><td colspan="7" class="text-center">Cargando datos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = 'https://api-medidores-x258.onrender.com/api';
        let datosGlobales = []; // Guarda todos los datos originales
        let datosFiltrados = []; // Guarda solo los datos que se están mostrando

        function verificarAcceso() {
            const pass = document.getElementById('inputPass').value;
            if (pass === "consorcio2026") {
                document.getElementById('pantallaLogin').style.display = 'none';
                document.getElementById('pantallaDashboard').style.display = 'block';
                cargarDatos();
            } else {
                alert("Contraseña incorrecta.");
            }
        }

        async function cargarDatos() {
            try {
                const respuesta = await fetch(`${API_URL}/lecturas`);
                const json = await respuesta.json();
                
                if (json.status === "success") {
                    datosGlobales = json.data;
                    datosFiltrados = datosGlobales; // De entrada, mostramos todos
                    
                    armarDesplegablePeriodos();
                    renderizarTabla();
                }
            } catch (error) {
                alert('Error al intentar cargar los registros desde el servidor.');
            }
        }

        function armarDesplegablePeriodos() {
            const select = document.getElementById('filtroPeriodo');
            
            // 1. Extraemos todos los periodos y armamos un Set para que no haya repetidos
            const periodosUnicos = [...new Set(datosGlobales.map(item => item.periodo))];
            
            // 2. Si hay periodos vacíos por registros viejos fallidos, los sacamos
            const periodosLimpios = periodosUnicos.filter(p => p !== null && p !== '');

            // 3. Agregamos cada mes al desplegable
            periodosLimpios.forEach(periodo => {
                const option = document.createElement('option');
                option.value = periodo;
                // Formateamos para que se vea más lindo, ej: "2026-08"
                option.text = periodo; 
                select.appendChild(option);
            });
            
            // 4. Seleccionamos automáticamente el mes más reciente (suelen venir ordenados desc)
            if (periodosLimpios.length > 0) {
                select.value = periodosLimpios[0];
                aplicarFiltro(); // Forzamos a que aplique el filtro apenas carga
            }
        }

        function aplicarFiltro() {
            const periodoSeleccionado = document.getElementById('filtroPeriodo').value;
            
            if (periodoSeleccionado === "todos") {
                datosFiltrados = datosGlobales;
            } else {
                datosFiltrados = datosGlobales.filter(item => item.periodo === periodoSeleccionado);
            }
            
            renderizarTabla();
        }

        function renderizarTabla() {
            const tbody = document.getElementById('tablaCuerpo');
            tbody.innerHTML = '';

            if (datosFiltrados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center">No hay registros para mostrar.</td></tr>';
                return;
            }

            datosFiltrados.forEach(fila => {
                const lote = fila.lote || 'Sin lote';
                const anterior = fila.lectura_anterior !== null ? fila.lectura_anterior : '-';
                const consumo = fila.consumo_neto !== null ? fila.consumo_neto : 'Primer registro';
                
                tbody.innerHTML += `
                    <tr>
                        <td><span class="badge bg-secondary">${fila.periodo}</span></td>
                        <td class="fw-bold">${lote}</td>
                        <td>${fila.id_medidor}</td>
                        <td>${fila.lectura_actual}</td>
                        <td>${anterior}</td>
                        <td class="fw-bold text-success">${consumo}</td>
                        <td>
                            <a href="${fila.ruta_evidencia}" target="_blank" class="btn btn-sm btn-outline-primary">Ver Foto</a>
                        </td>
                    </tr>
                `;
            });
        }

        function exportarCSV() {
            if (datosFiltrados.length === 0) {
                alert('No hay datos para exportar en el período seleccionado.');
                return;
            }
            
            const periodoSeleccionado = document.getElementById('filtroPeriodo').value;
            let nombreArchivo = "consumos_todos.csv";
            if (periodoSeleccionado !== "todos") {
                nombreArchivo = `consumos_${periodoSeleccionado}.csv`;
            }
            
            let csv = 'Periodo,Lote,Medidor,Lectura_Actual,Lectura_Anterior,Consumo_Neto,Fecha,Enlace_Foto\n';
            
            datosFiltrados.forEach(fila => {
                const lote = fila.lote || '';
                const anterior = fila.lectura_anterior !== null ? fila.lectura_anterior : '';
                const consumo = fila.consumo_neto !== null ? fila.consumo_neto : '';
                const fecha = fila.fecha_lectura ? new Date(fila.fecha_lectura).toLocaleDateString('es-AR') : '';
                
                csv += `"${fila.periodo}","${lote}",${fila.id_medidor},${fila.lectura_actual},${anterior},${consumo},${fecha},${fila.ruta_evidencia}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = nombreArchivo;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.getElementById("inputPass").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                verificarAcceso();
            }
        });
    </script>
</body>
</html>

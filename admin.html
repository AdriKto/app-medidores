<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Consumos del Mes</h2>
        <button class="btn btn-success" onclick="exportarCSV()">Descargar CSV</button>
    </div>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Lote</th>
                <th>Medidor</th>
                <th>Lectura (kW/h)</th>
                <th>Fecha</th>
                <th>Foto</th>
            </tr>
        </thead>
        <tbody id="tablaCuerpo">
            <tr><td colspan="5">Cargando datos...</td></tr>
        </tbody>
    </table>

    <script>
        const API_URL = 'https://api-medidores-x258.onrender.com/api';
        let datosGlobales = [];

        async function cargarDatos() {
            try {
                const respuesta = await fetch(`${API_URL}/lecturas`);
                const json = await respuesta.json();
                
                if (json.status === "success") {
                    datosGlobales = json.data;
                    const tbody = document.getElementById('tablaCuerpo');
                    tbody.innerHTML = '';

                    datosGlobales.forEach(fila => {
                        // Supabase devuelve el join como un objeto anidado
                        const lote = fila.medidores ? fila.medidores.lote : 'Sin lote';
                        const fecha = new Date(fila.fecha_lectura).toLocaleDateString('es-AR');
                        
                        tbody.innerHTML += `
                            <tr>
                                <td>${lote}</td>
                                <td>${fila.id_medidor}</td>
                                <td>${fila.valor_lectura}</td>
                                <td>${fecha}</td>
                                <td><a href="${fila.ruta_evidencia}" target="_blank" class="btn btn-sm btn-info">Ver Foto</a></td>
                            </tr>
                        `;
                    });
                }
            } catch (error) {
                alert('Error cargando los datos');
            }
        }

        function exportarCSV() {
            if (datosGlobales.length === 0) return alert('No hay datos para exportar');
            
            let csv = 'Lote,Medidor,Lectura,Fecha,Enlace_Foto\n';
            
            datosGlobales.forEach(fila => {
                const lote = fila.medidores ? fila.medidores.lote : '';
                const fecha = new Date(fila.fecha_lectura).toLocaleDateString('es-AR');
                csv += `"${lote}",${fila.id_medidor},${fila.valor_lectura},${fecha},${fila.ruta_evidencia}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "lecturas_consorcio.csv";
            link.click();
        }

        cargarDatos();
    </script>
</body>
</html>
